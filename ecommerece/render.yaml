services:
  - type: web
    name: ecommerce-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_admin_user --username root --email admin@example.com
    startCommand: gunicorn ecommerece.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ecommerece.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ecommerce-backend.onrender.com
      - key: RENDER
        value: True
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
    disk:
      name: media-storage
      mountPath: /opt/render/project/src/media
      sizeGB: 1
